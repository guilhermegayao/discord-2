name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo branch/PR quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: discord2
          POSTGRES_PASSWORD: discord2_ci
          POSTGRES_DB: discord2
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U discord2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://discord2:discord2_ci@localhost:5433/discord2?schema=public
      DB_TESTS: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Aplica as migrations num banco limpo e falha se o schema.prisma
      # tiver mudanças sem migration correspondente.
      - name: Migrations em dia com o schema
        run: npm run prisma:check -w @discord-2/server

      - name: Testes (inclui integração com Postgres)
        run: npm test

      - name: Build
        run: npm run build
